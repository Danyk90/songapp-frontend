<h2>Upload New Song</h2>

<input type="file" (change)="onFileSelected($event)" accept="audio/mpeg" />

<button (click)="uploadFile()" [disabled]="!selectedFile">
  Upload
</button>

<p *ngIf="uploadSuccess" style="color: green;">
  Upload Successful!
</p>

<p *ngIf="uploadError" style="color: red;">
  {{ uploadError }}
</p>
